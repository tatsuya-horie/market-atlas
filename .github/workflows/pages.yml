name: Publish market dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # weekdays 08:15 and 23:15 JST, best-effort GitHub scheduler
    - cron: '15 23 * * 0-4'
    - cron: '15 14 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh published fund summaries when provider CSV is available
        run: python3 scripts/refresh_funds.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
